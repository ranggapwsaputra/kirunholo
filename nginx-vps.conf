server {
    listen 80;
    server_name holo.hita-id.org;

    # Redirect HTTP → HTTPS (aktif setelah Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name holo.hita-id.org;

    # SSL certificates — will be filled in by Certbot automatically
    ssl_certificate     /etc/letsencrypt/live/holo.hita-id.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holo.hita-id.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Frontend (Vite React app via Docker) ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Agentvoice WebSocket (Python server via Docker) ───────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
