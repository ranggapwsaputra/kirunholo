services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    restart: always
    env_file:
      - .env
    depends_on:
      - agentvoice

  agentvoice:
    build:
      context: ./agentvoice
      dockerfile: Dockerfile
    ports:
      - "9080:9080"
    restart: always
    env_file:
      - ./agentvoice/.env
